<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'self'">
<style>
  :root { font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; color: #fff; --blue: #0a84ff; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .card { background: rgba(28, 28, 30, 0.98); border-radius: 16px; border: 0.5px solid rgba(255, 255, 255, 0.18); padding: 14px 16px; animation: in 0.22s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(-10px); } }
  .row { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; flex: none; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; } .sub { color: rgba(255, 255, 255, 0.62); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; }
  .grow { flex: 1; min-width: 0; }
  .consent { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); font-size: 12px; cursor: pointer; }
  .consent input { margin-top: 2px; accent-color: var(--blue); }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 7px 18px; cursor: pointer; color: #fff; background: rgba(255, 255, 255, 0.16); }
  button:hover { background: rgba(255, 255, 255, 0.24); } button.primary { background: var(--blue); } button.primary:hover { filter: brightness(1.1); } button:disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body><div id="root"></div><script src="prompt.js"></script></body>
</html>
